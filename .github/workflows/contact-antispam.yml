name: Contact antispam
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exhaustive:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          tools: composer
          coverage: none
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: composer install --no-dev --no-interaction --prefer-dist
        working-directory: server/contact
      - run: composer validate --no-check-publish && composer audit --locked
        working-directory: server/contact
      - run: npm run check
      - run: npm run build
      - name: PHP syntax
        run: find server/contact/src server/contact/bin public tests/contact -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm run test:contact:php
      - run: npm run test:contact:http
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contact:browser
      - run: npm run test:contact:deployment
      - run: npm run package:contact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: contact-browser-php-${{ matrix.php }}
          path: output/playwright/
          retention-days: 7
          if-no-files-found: ignore
